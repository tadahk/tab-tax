<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tab tax</title>
<style>
  :root { color-scheme: light dark; --fg: #222; --bg: #fafafa; --mute: #888; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ddd; --bg: #1b1b1b; --line: #333; } }
  body { margin: 0; width: 250px; padding: 14px 16px; font: 13px/1.45 ui-monospace, Menlo, monospace; color: var(--fg); background: var(--bg); }
  label { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  h1 { font-size: 13px; font-weight: 600; margin: 0; }
  .note { color: var(--mute); margin: 6px 0 0; }
  input[type=number] { width: 48px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); padding: 2px 4px; }
</style>
</head>
<body>
<label><h1>tab tax</h1><input type="checkbox" id="on"></label>
<p class="note">every tab past <input type="number" id="limit" min="1" max="500"> greys your pages a little.</p>
<p class="note" id="status"></p>
<script src="popup.js"></script>
</body>
</html>
